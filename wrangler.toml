name = "ventura-starter"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]
main = "workers/app.ts"

[assets]
directory = "./build/client"

[[ratelimits]]
name = "GENERAL_RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 1000
  period = 60

[[ratelimits]]
name = "STRICT_RATE_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 100
  period = 60

[triggers]
crons = []

[env.dev]
name = "ventura-starter-dev"

  [[env.dev.ratelimits]]
  name = "GENERAL_RATE_LIMITER"
  namespace_id = "1001"
    [env.dev.ratelimits.simple]
    limit = 1000
    period = 60

  [[env.dev.ratelimits]]
  name = "STRICT_RATE_LIMITER"
  namespace_id = "1002"
    [env.dev.ratelimits.simple]
    limit = 100
    period = 60
